# Flood Alert Gateway Configuration
gateway:
  # Path to the Ed25519 private key (generated by keygen.py)
  private_key_path: ./keys/flood_authority.key
  
  # Hex-encoded public key (also hardcode this into the Android app)
  # This will be populated after running keygen.py
  public_key_hex: "b4f9dca1eb15469b780c72d5bcae1570f434a675f607b71a53653a4aa1ada05d"
  
  # 8-byte sender ID (first 8 bytes of SHA-256 of public key)
  sender_id_hex: "1118214dfa521d34"

# BitChat mesh settings
mesh:
  ttl: 7                    # Maximum relay hops (bitchat default)
  channel: "flood-alerts"   # Mesh channel name
  
  # BLE UUIDs (must match bitchat-android)
  ble_service_uuid: "f47b5e2d-4a9e-4c5a-9b3f-8e1d2c3a4b5c"
  ble_char_uuid: "a1b2c3d4-e5f6-4a5b-8c9d-0e1f2a3b4c5d"

# CAP alert defaults
alert:
  sender: "flood-authority@cap-mesh-gateway.local"
  sender_name: "Flood Alert Mesh Gateway"
  default_status: "Test"     # Change to "Actual" for real deployment
  expires_hours: 12

# Wi-Fi Captive Portal settings (see docs/setup_captive_portal.md)
captive_portal:
  hotspot_ip: "192.168.137.1"   # Your hotspot adapter IPv4 (from ipconfig)
  dns_port: 53                   # DNS interceptor port
  web_port: 80                   # Web server port
  hotspot_ssid: "!_EMERGENCY_FLOOD_ALERT_!"  # SSID to display
